# A reviewer runs `docker compose up` and gets a working, populated system.
#
# That is a hard constraint rather than a nicety: a demo that needs a setup
# document is a demo nobody sees. So the migration runner, the role bootstrap,
# the bucket creation and the seed data are all services in this file with
# explicit dependency ordering, not steps in a README.
#
# The credentials below are deliberately weak and deliberately committed. This
# file describes a local development stack and nothing else; the API refuses to
# start if it is handed a privileged database role, so a copy of this pointed at
# anything real fails loudly rather than quietly working.
#
# Published ports are overridable because 3000, 5433, 9000 and 9001 are popular
# and a developer with two projects open will collide on at least one of them.
# The failure is a Docker networking error that says nothing about which service
# wanted the port, so the five seconds spent parameterising these saves an
# unpleasant ten minutes. Override in .env or inline:
#
#   ALIQUOT_API_PORT=3100 ALIQUOT_MINIO_PORT=9200 docker compose up

name: aliquot

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aliquot
    ports:
      - '${ALIQUOT_POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # -d is not optional: without it pg_isready reports ready during the
      # initdb bootstrap, when the server is up but the database is not yet
      # there, and every dependent service races into a connection error.
      test: ['CMD-SHELL', 'pg_isready -U postgres -d aliquot']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  # ## Why this service answers to `minio.localhost`
  #
  # A presigned URL is signed for one host: SigV4 covers the Host header, so the
  # origin cannot be rewritten afterwards without invalidating the signature. The
  # viewer's sandbox tab uploads straight from the browser to the object store,
  # which means the name the API signs has to resolve, to this container, from
  # both inside the compose network and from a browser on the host.
  #
  # `minio` alone does not: it resolves only on this network. `localhost` alone
  # does not: inside the seed container it is the seed container. `minio.localhost`
  # does both -- Docker's embedded DNS answers it for containers because it is a
  # network alias, and RFC 6761 makes the host resolve anything under `.localhost`
  # to loopback, where the published port below is waiting.
  #
  # The port has to match on both sides for the same reason, which is why MinIO is
  # told to listen on the published port rather than being remapped onto 9000.
  #
  # If a host does not resolve `*.localhost` the degradation is soft and specific:
  # every container still reaches the store by the alias, and only the browser
  # upload fails -- with the message the sandbox tab prints for exactly this.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command:
      - server
      - /data
      - --address
      - ':${ALIQUOT_MINIO_PORT:-9000}'
      - --console-address
      - ':${ALIQUOT_MINIO_CONSOLE_PORT:-9001}'
    environment:
      MINIO_ROOT_USER: aliquot
      MINIO_ROOT_PASSWORD: aliquot-dev-secret
      # `mc ready local` below assumes the server is on 9000; it is not.
      MC_HOST_local: http://aliquot:aliquot-dev-secret@localhost:${ALIQUOT_MINIO_PORT:-9000}
    ports:
      - '${ALIQUOT_MINIO_PORT:-9000}:${ALIQUOT_MINIO_PORT:-9000}'
      - '${ALIQUOT_MINIO_CONSOLE_PORT:-9001}:${ALIQUOT_MINIO_CONSOLE_PORT:-9001}'
    networks:
      default:
        aliases:
          - minio.localhost
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  # One-shot. Applies migrations, then creates the unprivileged login role the
  # API and worker actually connect as. Runs as the database owner; nothing else
  # in the stack ever holds those credentials.
  migrate:
    build:
      context: .
      target: runtime
    command: ['node', 'dist/scripts/migrate.js']
    environment:
      DATABASE_ADMIN_URL: postgres://postgres:postgres@postgres:5432/aliquot
      APP_DB_USER: aliquot_login
      APP_DB_PASSWORD: aliquot-dev-secret
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  api:
    build:
      context: .
      target: runtime
    command: ['node', 'dist/src/main.js']
    environment:
      NODE_ENV: development
      SERVICE_ROLE: api
      PORT: 3000
      LOG_LEVEL: info
      DATABASE_URL: postgres://aliquot_login:aliquot-dev-secret@postgres:5432/aliquot
      STORAGE_ENDPOINT: http://minio.localhost:${ALIQUOT_MINIO_PORT:-9000}
      STORAGE_BUCKET: aliquot
      STORAGE_ACCESS_KEY_ID: aliquot
      STORAGE_SECRET_ACCESS_KEY: aliquot-dev-secret
      STORAGE_FORCE_PATH_STYLE: 'true'
      AUTH_JWT_SECRET: development-only-secret-not-for-any-real-deployment
      AUTH_DEV_TOKEN_ENDPOINT: 'true'
      # On locally, as it is on the deployment: the viewer's "Try it yourself"
      # tab is the only part of this stack that writes, and a local run that
      # cannot reach it is a different product from the one the walkthrough
      # describes. See ADR-0021.
      SANDBOX_MODE: 'true'
      # Six a minute is the production value, and it is right there: each
      # admitted request creates a tenant. It is wrong here, because the browser
      # suite provisions one per test from a single address and would otherwise
      # be testing the rate limiter. Raised on the development stack alone.
      SANDBOX_RATE_LIMIT_PER_MINUTE: 60
    ports:
      - '${ALIQUOT_API_PORT:-3000}:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  worker:
    build:
      context: .
      target: runtime
    command: ['node', 'dist/src/worker.js']
    environment:
      NODE_ENV: development
      SERVICE_ROLE: worker
      LOG_LEVEL: info
      DATABASE_URL: postgres://aliquot_login:aliquot-dev-secret@postgres:5432/aliquot
      STORAGE_ENDPOINT: http://minio.localhost:${ALIQUOT_MINIO_PORT:-9000}
      STORAGE_BUCKET: aliquot
      STORAGE_ACCESS_KEY_ID: aliquot
      STORAGE_SECRET_ACCESS_KEY: aliquot-dev-secret
      STORAGE_FORCE_PATH_STYLE: 'true'
      AUTH_JWT_SECRET: development-only-secret-not-for-any-real-deployment
      WORKER_CONCURRENCY: 4
      # The reaper lives here, not in the API. Without this the tenants the API
      # hands out are never collected and a long-lived dev stack accumulates
      # them.
      SANDBOX_MODE: 'true'
      SANDBOX_REAP_INTERVAL_MS: 60000
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy

  # One-shot. Seeds a tenant, a study, instruments, users, and a small set of
  # runs that have already been through the full lifecycle, so the lineage graph
  # and the audit chain have something in them the moment the viewer loads.
  seed:
    build:
      context: .
      target: runtime
    command: ['node', 'dist/scripts/seed.js']
    environment:
      NODE_ENV: development
      SERVICE_ROLE: api
      DATABASE_URL: postgres://aliquot_login:aliquot-dev-secret@postgres:5432/aliquot
      DATABASE_ADMIN_URL: postgres://postgres:postgres@postgres:5432/aliquot
      STORAGE_ENDPOINT: http://minio.localhost:${ALIQUOT_MINIO_PORT:-9000}
      STORAGE_BUCKET: aliquot
      STORAGE_ACCESS_KEY_ID: aliquot
      STORAGE_SECRET_ACCESS_KEY: aliquot-dev-secret
      STORAGE_FORCE_PATH_STYLE: 'true'
      AUTH_JWT_SECRET: development-only-secret-not-for-any-real-deployment
      API_BASE_URL: http://api:3000
    depends_on:
      api:
        condition: service_healthy
    restart: on-failure

  # The narrated walkthrough. Not started by `up`; run it explicitly:
  #
  #   docker compose run --rm demo
  #
  # It runs inside the compose network, which since ADR-0022 is convenience
  # rather than necessity: the store answers to one name that resolves to it
  # from here and from the host, so the presigned URLs this issues would work
  # from a laptop shell too. Kept as a container because it also wants `api` and
  # `postgres` by name, and because that is what the README documents.
  demo:
    profiles: ['demo']
    build:
      context: .
      target: runtime
    command: ['node', 'dist/scripts/demo.js']
    environment:
      NODE_ENV: development
      SERVICE_ROLE: api
      DATABASE_URL: postgres://aliquot_login:aliquot-dev-secret@postgres:5432/aliquot
      DATABASE_ADMIN_URL: postgres://postgres:postgres@postgres:5432/aliquot
      STORAGE_ENDPOINT: http://minio.localhost:${ALIQUOT_MINIO_PORT:-9000}
      STORAGE_BUCKET: aliquot
      STORAGE_ACCESS_KEY_ID: aliquot
      STORAGE_SECRET_ACCESS_KEY: aliquot-dev-secret
      STORAGE_FORCE_PATH_STYLE: 'true'
      AUTH_JWT_SECRET: development-only-secret-not-for-any-real-deployment
      API_BASE_URL: http://api:3000
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  minio-data:
