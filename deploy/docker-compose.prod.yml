# Production stack for a shared VPS.
#
# Differences from the development compose file, and the reason for each:
#
#   - Images are pulled from GHCR by digest-bearing tag rather than built here.
#     A server that builds its own images is a server whose running code is not
#     the code CI tested.
#   - Nothing publishes a host port at all. The box runs two other projects and
#     there is one pair of 80/443 between them, so TLS lives in a shared edge
#     Caddy that reaches `api` by container name over the external `edge`
#     network. Postgres is on the project network only and has no route in.
#   - Object storage is Cloudflare R2 rather than a bundled MinIO. On a host
#     with two other services, one more stateful container whose volume is not
#     in the nightly dump is a liability the deployment does not need.
#   - Every secret comes from the environment. There are no credentials in this
#     file, which is why -- unlike the development one -- it is safe to read.
#   - Restart policies and log rotation exist, because an unattended box fills
#     its disk with JSON logs in about a fortnight otherwise.
#
# Deploy with:
#   docker compose -f deploy/docker-compose.prod.yml --env-file /etc/aliquot/aliquot.env up -d
#
# See docs/DEPLOYMENT.md for the full runbook, and the `edge` directory of the
# portfolio repository for the host as a whole.

name: aliquot

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

x-app-env: &app-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgres://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
  # Storage is deliberately fully env-driven, and the application only ever
  # speaks S3. Production points at Cloudflare R2; the development compose file
  # points the same variables at a local MinIO. Neither the API nor the worker
  # can tell which it is talking to -- see docs/DEPLOYMENT.md.
  STORAGE_ENDPOINT: ${STORAGE_ENDPOINT}
  STORAGE_REGION: ${STORAGE_REGION:-auto}
  STORAGE_BUCKET: ${STORAGE_BUCKET}
  STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID}
  STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY}
  STORAGE_FORCE_PATH_STYLE: ${STORAGE_FORCE_PATH_STYLE:-true}
  STORAGE_PRESIGN_TTL_SECONDS: ${STORAGE_PRESIGN_TTL_SECONDS:-3600}
  AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
  # Never enabled here. It mints a session for an arbitrary email address, and
  # the service refuses to start with it on when NODE_ENV=production.
  AUTH_DEV_TOKEN_ENDPOINT: 'false'
  DEMO_MODE: ${DEMO_MODE:-true}
  DEMO_TENANT_SLUG: ${DEMO_TENANT_SLUG:-acme}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Bind-mounted so scripts/backup.sh can drop dumps where the host can see
      # them without reaching into the container filesystem.
      - ${BACKUP_DIR:-/var/backups/aliquot}:/backups
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # One-shot, ordered before the API. Applying migrations from the same image
  # that runs the code means the two cannot drift by a deploy.
  migrate:
    image: ${ALIQUOT_IMAGE:-ghcr.io/youneskaouani/aliquot:latest}
    restart: 'no'
    logging: *logging
    command: ['node', 'dist/scripts/migrate.js']
    environment:
      DATABASE_ADMIN_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ${ALIQUOT_IMAGE:-ghcr.io/youneskaouani/aliquot:latest}
    restart: unless-stopped
    logging: *logging
    command: ['node', 'dist/src/main.js']
    environment:
      <<: *app-env
      SERVICE_ROLE: api
      PORT: 3000
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Deliberately no `ports`. The shared edge Caddy is the only thing the
    # internet can reach, and it finds this container by the alias below --
    # Compose would otherwise only publish the bare service name `api` onto a
    # network three projects share, where a second project with a service of the
    # same name would collide silently.
    networks:
      default: {}
      edge:
        aliases:
          - aliquot-api

  worker:
    image: ${ALIQUOT_IMAGE:-ghcr.io/youneskaouani/aliquot:latest}
    restart: unless-stopped
    logging: *logging
    command: ['node', 'dist/src/worker.js']
    environment:
      <<: *app-env
      SERVICE_ROLE: worker
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Profiled, so a redeploy never re-runs it by accident. The seed is idempotent
  # and still: `up -d` should not be able to touch data.
  #   docker compose -f deploy/docker-compose.prod.yml --profile seed run --rm seed
  seed:
    image: ${ALIQUOT_IMAGE:-ghcr.io/youneskaouani/aliquot:latest}
    restart: 'no'
    logging: *logging
    command: ['node', 'dist/scripts/seed.js']
    environment:
      <<: *app-env
      SERVICE_ROLE: api
      DATABASE_ADMIN_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      API_BASE_URL: http://api:3000
    depends_on:
      api:
        condition: service_healthy
    profiles: ['seed']

networks:
  # Postgres and the one-shot jobs live here and nowhere else.
  default: {}
  # Shared with the portfolio and the triage engine. Created out of band -- see
  # the `edge` directory of the portfolio repository -- rather than owned by any
  # one project, so no stack is a startup dependency of the other two.
  edge:
    name: edge
    external: true

volumes:
  postgres-data:
